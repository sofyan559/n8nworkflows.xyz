name: Build WordPress workflow library plugin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "catalog-index.json"
      - "wordpress-plugin/**"
      - "scripts/build_wordpress_plugin.py"
      - ".github/workflows/build-wordpress-plugin.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build plugin with local catalog
        run: python scripts/build_wordpress_plugin.py

      - name: Validate archive
        run: |
          unzip -t dist/eg-n8n-workflow-library-v1.0.3.zip
          unzip -l dist/eg-n8n-workflow-library-v1.0.3.zip | grep catalog.json

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: eg-n8n-workflow-library-v1.0.3
          path: dist/eg-n8n-workflow-library-v1.0.3.zip
          if-no-files-found: error
