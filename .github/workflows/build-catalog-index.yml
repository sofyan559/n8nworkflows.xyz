name: Build catalog index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "workflows/**"
      - "scripts/build_catalog_index.py"
      - ".github/workflows/build-catalog-index.yml"

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog-index.json
        run: python scripts/build_catalog_index.py

      - name: Commit updated index
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- catalog-index.json)" ]; then
            echo "catalog-index.json is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-index.json
          git commit -m "chore: update workflow catalog index"
          git push
